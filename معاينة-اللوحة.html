/* ==========================================================

:root {
  --bg: #0f1117;
  --bg-soft: #161923;
  --bg-card: #1a1e2b;
  --bg-input: #10131c;
  --border: #262c3d;
  --border-soft: #1f2532;
  --text: #e8ecf5;
  --muted: #8e97ad;
  --primary: #5865f2;
  --primary-hover: #4752c4;
  --success: #57f287;
  --success-bg: #10251b;
  --warning: #fee75c;
  --danger: #ed4245;
  --info: #00b0f4;
  --radius: 14px;
  --shadow: 0 10px 30px rgba(0, 0, 0, .35);
  --shell: #0d1017;
  --panel: #151a24;
  --panel-2: #11151e;
  --panel-3: #161c27;
  --hover: #171d28;

  font-family: "Segoe UI", "Tahoma", "Noto Kufi Arabic", system-ui, -apple-system, sans-serif;
}

/* ----------------------------- الوضع الفاتح ----------------------------- */
html[data-theme='light'] {
  --bg: #f4f6fb;
  --bg-soft: #ffffff;
  --bg-card: #ffffff;
  --bg-input: #f7f8fc;
  --border: #e2e6f0;
  --border-soft: #eceff6;
  --text: #1a1f36;
  --muted: #6b7488;
  --primary: #4f5bd5;
  --primary-hover: #3f49b8;
  --success: #1f9d55;
  --success-bg: #e8f8ee;
  --warning: #b8860b;
  --danger: #d83c3e;
  --info: #0b7ac4;
  --shadow: 0 10px 26px rgba(24, 32, 60, .10);
  --shell: #eef1f8;
  --panel: #ffffff;
  --panel-2: #ffffff;
  --panel-3: #fafbfe;
  --hover: #f2f4fa;
  --chip: #eef1f9;
  --track: #d7dcea;
  --overlay: rgba(255, 255, 255, .93);
}
html[data-theme='light'] body {
  background:
    radial-gradient(1200px 600px at 85% -10%, rgba(88, 101, 242, .12), transparent 60%),
    radial-gradient(900px 500px at 5% 0%, rgba(0, 176, 244, .08), transparent 55%),
    var(--bg);
}

* { box-sizing: border-box; }

body {
  margin: 0;
  background:
    radial-gradient(1200px 600px at 85% -10%, rgba(88, 101, 242, .18), transparent 60%),
    radial-gradient(900px 500px at 5% 0%, rgba(0, 176, 244, .10), transparent 55%),
    var(--bg);
  color: var(--text);
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  line-height: 1.7;
}

a { color: var(--primary); text-decoration: none; }
a:hover { text-decoration: none; opacity: .9; }
code {
  background: var(--bg-input);
  border: 1px solid var(--border);
  padding: 2px 7px;
  border-radius: 7px;
  font-size: .88em;
  direction: ltr;
  display: inline-block;
}
.muted { color: var(--muted); }
.accent { color: var(--info); }

/* ----------------------------- الشريط العلوي ----------------------------- */
.topbar {
  display: flex;
  align-items: center;
  gap: 24px;
  padding: 14px 28px;
  background: rgba(22, 25, 35, .85);
  backdrop-filter: blur(10px);
  border-bottom: 1px solid var(--border);
  position: sticky;

}
.brand { display: flex; align-items: center; gap: 10px; font-weight: 800; font-size: 1.25rem; color: var(--text); }
.brand-logo { font-size: 1.6rem; }
.nav { display: flex; gap: 18px; margin-inline-start: auto; }
.nav a { color: var(--muted); font-weight: 600; }
.nav a:hover { color: var(--text); }
.auth { display: flex; align-items: center; gap: 12px; }
.user-box { display: flex; align-items: center; gap: 10px; }
.user-name { font-weight: 700; }

/* ----------------------------- الأزرار ----------------------------- */
.btn {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  padding: 9px 16px;
  border-radius: 10px;
  border: 1px solid transparent;
  font-weight: 700;

  cursor: pointer;

  font-family: inherit;
}
.btn-primary { background: var(--primary); color: #fff; }
.btn-primary:hover { background: var(--primary-hover); }
.btn-ghost { background: transparent; color: var(--text); border-color: var(--border); }
.btn-ghost:hover { background: var(--bg-card); }
.btn-danger { background: var(--danger); color: #fff; }
.btn-success { background: var(--success); color: #10281a; }
.btn-lg { padding: 13px 24px; font-size: 1.05rem; }
.btn-sm { padding: 6px 12px; font-size: .85rem; }
.btn:disabled { opacity: .55; cursor: not-allowed; }

/* ----------------------------- الحاويات ----------------------------- */
.container { width: min(1180px, 100%); margin: 0 auto; padding: 32px 20px 60px; flex: 1; }
.footer {
  border-top: 1px solid var(--border);
  padding: 18px 28px;
  display: flex;
  justify-content: space-between;
  color: var(--muted);
  font-size: .9rem;
  flex-wrap: wrap;
  gap: 8px;
}

/* ----------------------------- الصفحة الرئيسية ----------------------------- */
.hero { text-align: center; padding: 34px 0 18px; }
.pill {
  display: inline-block;
  background: rgba(88, 101, 242, .15);
  border: 1px solid rgba(88, 101, 242, .4);
  color: #aab3ff;
  padding: 6px 14px;
  border-radius: 999px;
  font-weight: 700;
  font-size: .85rem;
}
.hero h1 { font-size: clamp(1.8rem, 4vw, 3rem); margin: 18px 0 12px; line-height: 1.35; }
.grad { background: linear-gradient(90deg, #5865f2, #00b0f4); -webkit-background-clip: text; background-clip: text; color: transparent; }
.lead { color: var(--muted); max-width: 720px; margin: 0 auto; font-size: 1.05rem; }
.cta { display: flex; gap: 14px; justify-content: center; flex-wrap: wrap; margin: 26px 0; }
.stat-row { display: flex; gap: 14px; justify-content: center; flex-wrap: wrap; }
.stat {
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 14px 26px;
  min-width: 140px;
}
.stat b { display: block; font-size: 1.6rem; color: var(--info); }
.stat span { color: var(--muted); font-size: .9rem; }

.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 16px; margin: 40px 0; }
.card {
  background: linear-gradient(180deg, var(--bg-card), #171b27);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 20px;
  transition: .18s ease;
}
.card:hover { transform: translateY(-3px); border-color: #37405c; box-shadow: var(--shadow); }
.card-icon { font-size: 1.8rem; }
.card h3 { margin: 10px 0 6px; font-size: 1.1rem; }
.card p { margin: 0; color: var(--muted); font-size: .95rem; }

.howto { background: var(--bg-soft); border: 1px solid var(--border); border-radius: var(--radius); padding: 26px; }
.howto h2 { margin-top: 0; }
.steps { padding-inline-start: 22px; }
.steps li { margin-bottom: 10px; }
.steps li b { color: var(--info); }

/* ----------------------------- قائمة السيرفرات ----------------------------- */
.page-head { display: flex; align-items: center; justify-content: space-between; gap: 16px; flex-wrap: wrap; margin-bottom: 22px; }
.page-head h1 { margin: 0; }
.guild-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 14px; }
.guild-card {
  display: flex;
  align-items: center;
  gap: 14px;
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 14px;
  color: var(--text);
}
.guild-card:hover { border-color: var(--primary); }
.guild-card.disabled { opacity: .6; cursor: not-allowed; }
.guild-icon { width: 52px; height: 52px; border-radius: 50%; object-fit: cover; }
.guild-icon.placeholder {
  display: grid; place-items: center; background: var(--primary); font-weight: 800;
}
.guild-info { display: flex; flex-direction: column; }
.badge { font-size: .75rem; padding: 3px 10px; border-radius: 999px; font-weight: 700; }
.badge-ok { background: rgba(87, 242, 135, .15); color: var(--success); }
.badge-warn { background: rgba(254, 231, 92, .15); color: var(--warning); }
.badge-off { background: rgba(142, 151, 173, .15); color: var(--muted); }
.info-note, .empty {
  margin-top: 22px; padding: 18px; border-radius: var(--radius);
  background: var(--bg-soft); border: 1px dashed var(--border); color: var(--muted);
}
.empty { text-align: center; }

/* ----------------------------- لوحة السيرفر ----------------------------- */
.loading { padding: 60px; text-align: center; color: var(--muted); }
.dash-head {
  display: flex; align-items: center; gap: 16px; flex-wrap: wrap;
  background: var(--bg-card); border: 1px solid var(--border);
  border-radius: var(--radius); padding: 18px; margin-bottom: 18px;
}
.dash-head .guild-icon { width: 62px; height: 62px; }
.dash-head h1 { margin: 0; font-size: 1.4rem; }
.dash-head .sub { color: var(--muted); font-size: .9rem; }
.dash-actions { margin-inline-start: auto; display: flex; gap: 10px; flex-wrap: wrap; }

.stats-row { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 12px; margin-bottom: 20px; }
.stat-box {
  background: var(--bg-card); border: 1px solid var(--border); border-radius: 12px; padding: 14px;
  text-align: center;
}
.stat-box b { display: block; font-size: 1.5rem; }
.stat-box span { color: var(--muted); font-size: .85rem; }

.tabs { display: flex; gap: 6px; flex-wrap: wrap; border-bottom: 1px solid var(--border); margin-bottom: 20px; }
.tab {
  padding: 10px 16px; border: none; background: transparent; color: var(--muted);
  font-weight: 700; cursor: pointer; border-bottom: 2px solid transparent; font-family: inherit; font-size: .95rem;
}
.tab:hover { color: var(--text); }
.tab.active { color: var(--text); border-bottom-color: var(--primary); }

.panel { display: none; }
.panel.active { display: block; animation: fade .2s ease; }
@keyframes fade { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }

.section {
  background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--radius);
  padding: 20px; margin-bottom: 16px;
}
.section h3 { margin: 0 0 4px; font-size: 1.05rem; }
.section .hint { color: var(--muted); font-size: .88rem; margin-bottom: 14px; }

.field { display: flex; align-items: center; justify-content: space-between; gap: 18px; padding: 12px 0; border-bottom: 1px dashed var(--border); flex-wrap: wrap; }
.field:last-child { border-bottom: none; }
.field-label { display: flex; flex-direction: column; }
.field-label b { font-weight: 700; }
.field-label small { color: var(--muted); font-size: .82rem; }
.field-control { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.field-control input[type="text"], .field-control input[type="number"], .field-control select, .field-control textarea {
  background: var(--bg-input); border: 1px solid var(--border); color: var(--text);
  padding: 9px 12px; border-radius: 9px; font-family: inherit; font-size: .92rem; min-width: 220px;
}
.field-control textarea { min-height: 90px; width: 100%; resize: vertical; line-height: 1.6; }
.field-control input:focus, .field-control select:focus, .field-control textarea:focus {
  outline: none; border-color: var(--primary);
}

.switch { position: relative; width: 54px; height: 30px; flex-shrink: 0; }
.switch input { opacity: 0; width: 0; height: 0; }
.slider {
  position: absolute; inset: 0; background: #333a4f; border-radius: 999px; transition: .2s; cursor: pointer;
}
.slider::before {
  content: ''; position: absolute; width: 22px; height: 22px; border-radius: 50%;
  background: #fff; top: 4px; right: 4px; transition: .2s;
}
.switch input:checked + .slider { background: var(--success); }
.switch input:checked + .slider::before { transform: translateX(-24px); }

.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip {
  background: var(--bg-input); border: 1px solid var(--border); border-radius: 999px;
  padding: 5px 12px; font-size: .85rem; display: inline-flex; align-items: center; gap: 6px;
}
.chip button { background: none; border: none; color: var(--danger); cursor: pointer; font-size: 1rem; line-height: 1; }

.table { width: 100%; border-collapse: collapse; font-size: .92rem; }
.table th, .table td { padding: 10px 12px; text-align: start; border-bottom: 1px solid var(--border); }
.table th { color: var(--muted); font-weight: 700; font-size: .85rem; }
.table tr:hover td { background: rgba(255, 255, 255, .02); }

.toast {
  position: fixed; inset-inline-start: 24px; bottom: 24px; z-index: 60;
  background: var(--bg-card); border: 1px solid var(--border); border-inline-start: 4px solid var(--success);
  padding: 14px 18px; border-radius: 12px; box-shadow: var(--shadow); font-weight: 700;
  opacity: 0; transform: translateY(10px); transition: .25s ease; pointer-events: none;
}
.toast.show { opacity: 1; transform: none; }
.toast.error { border-inline-start-color: var(--danger); }

.save-bar {
  position: sticky; bottom: 0; z-index: 15;
  background: rgba(15, 17, 23, .92); backdrop-filter: blur(8px);
  border-top: 1px solid var(--border); margin: 24px -20px -60px; padding: 14px 20px;
  display: flex; align-items: center; justify-content: space-between; gap: 14px; flex-wrap: wrap;
}
.save-bar .status { color: var(--muted); font-size: .9rem; }

/* ==========================================================
   تبديل الوضع الليلي/النهاري + الصفحة الرئيسية الجديدة
   ========================================================== */
.theme-toggle {
  background: transparent;
  border: 1px solid var(--border);
  color: var(--text);
  width: 38px;
  height: 38px;
  border-radius: 10px;
  cursor: pointer;
  font-size: 1rem;
  display: grid;
  place-items: center;
}
.theme-toggle:hover { background: var(--bg-card); }

/* ----------------------------- الصفحة الرئيسية ----------------------------- */
.site-hero {
  display: grid;
  grid-template-columns: 1.05fr .95fr;
  gap: 34px;
  align-items: center;
  padding: 34px 0 18px;
}
.site-hero h1 { font-size: clamp(1.9rem, 4.2vw, 3.1rem); line-height: 1.35; margin: 14px 0; }
.site-hero .lead { margin: 0 0 22px; color: var(--muted); font-size: 1.06rem; max-width: 560px; }
.site-cta { display: flex; gap: 12px; flex-wrap: wrap; }
.site-hero-art {
  background: var(--bg-soft);
  border: 1px solid var(--border);
  border-radius: 20px;
  padding: 18px;
  box-shadow: var(--shadow);
}
.site-hero-art .mock-bar { display: flex; gap: 6px; margin-bottom: 14px; }
.site-hero-art .mock-bar i { width: 10px; height: 10px; border-radius: 50%; background: var(--border); display: block; }
.site-hero-art .mock-title { font-weight: 800; margin-bottom: 12px; color: var(--text); }
.site-hero-art .mock-row {
  display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-radius: 12px;
  background: var(--bg-card); border: 1px solid var(--border); margin-bottom: 8px; font-size: .92rem;
}
.site-hero-art .mock-row .lbl { flex: 1; color: var(--text); }
.site-hero-art .mock-row .val { color: var(--muted); font-size: .82rem; }

.site-features { display: grid; grid-template-columns: repeat(auto-fill, minmax(255px, 1fr)); gap: 14px; margin: 20px 0 10px; }
.site-feature {
  background: var(--bg-soft); border: 1px solid var(--border); border-radius: var(--radius);
  padding: 16px 16px 14px;
}
.site-feature .fi { font-size: 1.5rem; }
.site-feature b { display: block; margin: 8px 0 5px; color: var(--text); font-size: 1rem; }
.site-feature p { margin: 0; color: var(--muted); font-size: .9rem; line-height: 1.75; }

.site-steps { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 14px; }
.site-step { background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--radius); padding: 16px; }
.site-step .n {
  width: 30px; height: 30px; border-radius: 9px; background: var(--primary); color: #fff;
  display: grid; place-items: center; font-weight: 800; margin-bottom: 10px;
}
.site-step b { display: block; margin-bottom: 4px; }
.site-step p { margin: 0; color: var(--muted); font-size: .9rem; }

.cmd-preview {
  background: var(--bg-input); border: 1px solid var(--border); border-radius: var(--radius);
  padding: 14px 16px; direction: ltr; text-align: left; font-family: 'Courier New', monospace;
  font-size: .86rem; color: var(--muted); line-height: 2; overflow-x: auto; margin: 0;
}
.cmd-preview b { color: var(--info); font-weight: 700; }

.section-title { display: flex; align-items: center; gap: 10px; margin: 34px 0 14px; }
.section-title h2 { margin: 0; font-size: 1.4rem; }
.section-title .hr { flex: 1; height: 1px; background: var(--border); }

/* ----------------------------- قائمة السيرفرات ----------------------------- */
.servers-toolbar { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 16px; align-items: center; }
.servers-toolbar input {
  flex: 1 1 240px; padding: 11px 14px; border-radius: 12px; border: 1px solid var(--border);
  background: var(--bg-input); color: var(--text); font: inherit; font-size: .95rem;
}
.servers-toolbar input:focus { outline: none; border-color: var(--primary); }
.servers-toolbar .seg { display: inline-flex; background: var(--bg-soft); border: 1px solid var(--border); border-radius: 12px; padding: 3px; }
.servers-toolbar .seg button {
  background: none; border: none; color: var(--muted); font: inherit; font-size: .88rem; font-weight: 700;
  padding: 8px 14px; border-radius: 9px; cursor: pointer;
}
.servers-toolbar .seg button.active { background: var(--chip); color: var(--text); }

.guild-card .guild-actions { display: flex; gap: 6px; margin-inline-start: auto; align-items: center; flex-wrap: wrap; }
.badge { font-size: .75rem; padding: 4px 10px; border-radius: 999px; font-weight: 700; }
.badge-ok { background: var(--success-bg); color: var(--success); border: 1px solid var(--border); }
.badge-warn { background: transparent; color: var(--warning); border: 1px solid var(--border); }
.badge-danger { background: transparent; color: var(--danger); border: 1px solid var(--border); }

.feature-note {
  background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--radius);
  padding: 18px 20px; display: flex; gap: 14px; align-items: flex-start; margin: 22px 0 0;
}
.feature-note .ni { font-size: 1.4rem; }

@media (max-width: 860px) {
  .site-hero { grid-template-columns: 1fr; padding-top: 18px; }
}

/* ============================ أيقونات (نسخة رسمية) ============================ */
.brand-logo { display: inline-flex; align-items: center; }
.brand-logo svg { display: block; }
.stat .stat-ico { color: var(--info); display: block; margin-bottom: 6px; }
.site-feature .fi { display: inline-flex; color: var(--primary); }
.site-feature b { margin-top: 10px; }
.site-step .n { font-size: .95rem; }
.mock-ico { color: var(--muted); display: inline-flex; }
.mock-title { display: flex; align-items: center; gap: 8px; }
.mock-title svg { color: var(--primary); }
.pill svg, .btn svg { vertical-align: -3px; }
.btn { display: inline-flex; align-items: center; gap: 7px; }
.guild-actions .btn { white-space: nowrap; }
.head-actions { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.guild-info span { display: inline-flex; align-items: center; gap: 5px; }
.search-wrap { position: relative; display: flex; align-items: center; flex: 1 1 240px; }
.search-wrap svg { position: absolute; inset-inline-start: 12px; color: var(--muted); pointer-events: none; }
.search-wrap input { padding-inline-start: 36px; width: 100%; }
.site-hero .stat b { font-size: 1.5rem; }
.brand-text { font-weight: 800; letter-spacing: -.3px; }

/* =====================================================================
   تكيّف مع الأجهزة: جوال • تابلت • سطح المكتب • الشاشات الكبيرة
   ===================================================================== */

/* حافة آمنة لهواتف iPhone (النتشة والعنوان السفلي) */
body {
  padding-left: env(safe-area-inset-left);
  padding-right: env(safe-area-inset-right);
}
.topbar {
  padding-top: max(10px, env(safe-area-inset-top));
}
.footer { padding-bottom: calc(18px + env(safe-area-inset-bottom)); }

/* خطوط تتكيّف مع عرض الشاشة */
h1 { font-size: clamp(1.5rem, 1.05rem + 2.2vw, 2.3rem); }
h2 { font-size: clamp(1.2rem, 0.95rem + 1.2vw, 1.65rem); }
.site-hero h1 { font-size: clamp(1.75rem, 1.1rem + 3vw, 3rem); }
.site-hero p { font-size: clamp(0.95rem, 0.85rem + 0.5vw, 1.12rem); }

/* لمس أنعم على الجوال */
a, button, .btn, .pill, .guild-card {
  -webkit-tap-highlight-color: rgba(91, 108, 255, 0.18);
}
.btn, .theme-toggle { min-height: 40px; }

/* ماوس فقط: تأثيرات التحويم لا تُطبّق على اللمس */
@media (hover: hover) and (pointer: fine) {
  .guild-card:hover { transform: translateY(-2px); }
}

/* احترام تقليل الحركة */
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: 0.01ms !important; transition-duration: 0.01ms !important; }
}

/* تابلت */
@media (max-width: 1024px) {
  .site-features, .site-steps { grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); }
  .cmd-preview { grid-template-columns: 1fr; }
}

/* تابلت صغير / جوال كبير */
@media (max-width: 860px) {
  .topbar { flex-wrap: wrap; gap: 10px; row-gap: 12px; }
  .nav {
    order: 3;
    width: 100%;
    overflow-x: auto;
    -webkit-overflow-scrolling: touch;
    scrollbar-width: none;
    gap: 6px;
  }
  .nav::-webkit-scrollbar { display: none; }
  .nav a { white-space: nowrap; }
  .auth { margin-inline-start: auto; }
  .stat-row { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .site-cta .btn { flex: 1 1 auto; justify-content: center; }
  .mock-bar { flex-wrap: wrap; }
}

/* جوال */
@media (max-width: 620px) {
  .container { padding-inline: 14px; }
  .site-features, .site-steps, .stat-row { grid-template-columns: 1fr; }
  .site-hero { padding-block: 26px 18px; text-align: center; }
  .site-step { gap: 10px; }
  .cmd-preview { font-size: .84rem; }
  .cmd-line { flex-wrap: wrap; row-gap: 4px; }
  .mock-panel { border-radius: 14px; }
  .mock-row { font-size: .84rem; }
  .search-wrap { flex: 1 1 100%; }
  .head-actions { width: 100%; }
  .head-actions .btn { flex: 1 1 auto; justify-content: center; }
  .guild-card { flex-wrap: wrap; }
  .guild-actions { width: 100%; }
  .guild-actions .btn { width: 100%; justify-content: center; }
  .footer { flex-direction: column; align-items: flex-start; gap: 6px; text-align: start; }
  .footer .muted { white-space: normal; }
  /* منع تكبير iOS التلقائي عند الكتابة */
  input, select, textarea { font-size: 16px; }
}

/* جوال صغير جدًا */
@media (max-width: 400px) {
  .btn { padding-inline: 12px; font-size: .86rem; }
  .brand-text { font-size: 1rem; }
  .pill { font-size: .72rem; }
  .container { padding-inline: 12px; }
}

/* شاشات كبيرة: لا يتمدّد النص بلا نهاية */
@media (min-width: 1500px) {
  .container { max-width: 1320px; }
  .site-features { grid-template-columns: repeat(4, minmax(0, 1fr)); }
}

/* الشاشات الأفقية المنخفضة (جوال بالعرض) */
@media (max-height: 480px) and (orientation: landscape) {
  .site-hero { padding-block: 18px 10px; }
  .topbar { padding-block: 8px; }
}

/* الطباعة */
@media print {
  .topbar, .footer, .site-cta, .theme-toggle, .auth { display: none !important; }
  body { background: #fff; color: #000; }
}

/**
 * يرجع وسم SVG جاهز.
 * @param {string} name اسم الأيقونة
 * @param {{size?:number, cls?:string, stroke?:number}} [opts]
 */
function icon(name, opts = {}) {
  const { size = 20, cls = 'ico', stroke = 1.7 } = opts;
  const body = ICONS[name] || ICONS.circle;
  return `<svg class="${cls}" viewBox="0 0 24 24" width="${size}" height="${size}" fill="none" stroke="currentColor" stroke-width="${stroke}" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">${body}</svg>`;
}

function iconForEvent(key = '') {
  const k = String(key);
  const rules = [
    [/invite/i, 'link'],
    [/thread/i, 'thread'],
    [/deafen/i, 'volume'],
    [/voicemute|^mute/i, 'mic'],
    [/voice/i, 'speaker'],
    [/emoji|sticker/i, 'emoticon'],
    [/permission|overwrite/i, 'key'],
    [/channel/i, 'hash'],
    [/role/i, 'tag'],
    [/ban/i, 'ban'],
    [/kick/i, 'userMinus'],
    [/timeout|sleep/i, 'sleep'],
    [/boost|premium/i, 'star'],
    [/avatar|nickname|username/i, 'edit'],
    [/join|memberjoin/i, 'userPlus'],
    [/leave|memberleave|memberremove/i, 'userMinus'],
    [/member|user/i, 'userRound'],

const state = {
  /** هل الزائر يقدر يعدّل؟ (الوصول العام = مشاهدة فقط) */
  canEdit: true,
  guildId: null,
  settings: null,
  meta: { channels: [], roles: [], logGroups: {}, logEvents: {}, emojis: [], cardAvailable: false },
  guild: null,
  stats: null,
  daily: [],
  section: 'overview',
  dirty: false,

/* ============================ أدوات عامة ============================ */
const el = (tag, attrs = {}, html = '') => {
  const node = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (k === 'class') node.className = v;
    else if (k === 'html') node.innerHTML = v;
    else if (k === 'text') node.textContent = v;
    else if (k.startsWith('on')) node.addEventListener(k.slice(2), v);
    else if (v !== null && v !== undefined && v !== false) node.setAttribute(k, v);
  }
  if (html) node.innerHTML = html;
  return node;
};

/** أيقونة SVG جاهزة للاستخدام داخل html */
const ic = (name, size = 17) => icon(name, { size });

const esc = (s) =>
  String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

async function api(path, options = {}) {
  const res = await fetch(`/api${path}`, {
    headers: { 'Content-Type': 'application/json' },
    credentials: 'same-origin',
    ...options,
    body: options.body ? JSON.stringify(options.body) : undefined,
  });
  if (!res.ok) throw new Error((await res.json().catch(() => ({}))).message || `خطأ ${res.status}`);
  return res.json();
}

function toast(message, isError = false) {
  let box = document.querySelector('.toast');
  if (!box) {
    box = el('div', { class: 'toast' });
    document.body.appendChild(box);
  }
  box.textContent = message;
  box.className = `toast show${isError ? ' error' : ''}`;
  clearTimeout(box._timer);
  box._timer = setTimeout(() => { box.className = 'toast'; }, 3200);
}

/* مسارات الإعدادات: getPath('welcome.message') */
function getPath(path) {
  return path.split('.').reduce((acc, key) => (acc === null || acc === undefined ? acc : acc[key]), state.settings);
}

function setPath(path, value) {
  const keys = path.split('.');
  let target = state.settings;
  for (const key of keys.slice(0, -1)) {
    if (target[key] === null || typeof target[key] !== 'object') target[key] = {};
    target = target[key];
  }
  target[keys[keys.length - 1]] = value;
  markDirty();
}

function markDirty() {
  state.dirty = true;
  const bar = document.querySelector('.d-savebar');
  if (!state.canEdit) return;
  if (bar) {
    bar.classList.add('show');
    const msg = bar.querySelector('.msg');
    msg.className = 'msg';
    msg.textContent = 'تغييرات غير محفوظة';
  }
}

/* ============================ عناصر الواجهة ============================ */
function dField(label, hint, controls, { wide = false } = {}) {
  const box = el('div', { class: `d-field${wide ? ' wide' : ''}` });
  const left = el('div', { class: 'd-field-label' });
  left.appendChild(el('b', { text: label }));
  if (hint) left.appendChild(el('span', { html: hint }));
  box.appendChild(left);
  const right = el('div', { class: 'd-field-control' });
  (Array.isArray(controls) ? controls : [controls]).filter(Boolean).forEach((c) => right.appendChild(c));
  box.appendChild(right);
  return box;
}

function dSwitch(path, onChangeExtra = null) {
  const wrap = el('label', { class: 'd-switch' });
  const input = el('input', { type: 'checkbox' });
  input.checked = Boolean(getPath(path));
  input.addEventListener('change', () => {
    setPath(path, input.checked);
    if (onChangeExtra) onChangeExtra(input.checked);
  });
  wrap.appendChild(input);
  wrap.appendChild(el('span'));
  return wrap;
}

function dInput(path, { placeholder = '', narrow = false, type = 'text', full = false, onChange = null } = {}) {
  const input = el('input', {
    class: `d-input${narrow ? ' narrow' : ''}${full ? ' full' : ''}`,
    type,
    placeholder,
  });
  const value = getPath(path);
  input.value = value === null || value === undefined ? '' : value;
  input.addEventListener('input', () => {
    const next = type === 'number' ? Number(input.value) : input.value;
    setPath(path, next === '' ? null : next);
    if (onChange) onChange(next);
  });
  return input;
}

function dNumber(path, { min = 0, max = 100000 } = {}) {
  const input = el('input', { class: 'd-input narrow', type: 'number', min, max });
  input.value = getPath(path) ?? 0;
  input.addEventListener('input', () => setPath(path, Math.max(min, Math.min(max, Number(input.value) || 0))));
  return input;
}

function dArea(path, { placeholder = '' } = {}) {
  const area = el('textarea', { class: 'd-textarea', placeholder });
  area.value = getPath(path) ?? '';
  area.addEventListener('input', () => setPath(path, area.value));
  return area;
}

function dSelect(path, options, { noneLabel = '— بدون —', onAfter = null } = {}) {
  const select = el('select', { class: 'd-select' });
  const current = getPath(path);
  if (noneLabel !== null) select.appendChild(el('option', { value: '', text: noneLabel }));
  options.forEach((opt) => {
    select.appendChild(el('option', { value: opt.value, text: opt.label, selected: opt.value === current ? 'selected' : '' }));
  });
  select.addEventListener('change', () => {
    setPath(path, select.value || null);
    if (onAfter) onAfter(select.value);
  });
  return select;
}

const channelOptions = (extra = []) =>
  [...state.meta.channels]
    .filter((c) => [0, 2, 4, 15].includes(c.type))
    .sort((a, b) => a.type - b.type || String(a.name).localeCompare(String(b.name), 'ar'))
    .map((c) => ({ value: c.id, label: `${c.type === 0 || c.type === 15 ? '#' : c.type === 4 ? '[قسم] ' : '[صوتي] '}${c.name}`, type: c.type }))
    .concat(extra);

const roleOptions = (filterOut = []) =>
  state.meta.roles.filter((r) => !filterOut.includes(r.id)).map((r) => ({ value: r.id, label: r.name }));

const categoryOptions = () => state.meta.channels.filter((c) => c.type === 4).map((c) => ({ value: c.id, label: c.name }));

const nameOfChannel = (id) => state.meta.channels.find((c) => c.id === id)?.name || id;
const nameOfRole = (id) => state.meta.roles.find((r) => r.id === id)?.name || id;

function dCard(title, desc, iconName, children, { tail = null, noPad = false, id = '' } = {}) {
  const card = el('div', { class: 'd-card', id });
  const head = el('div', { class: 'd-card-head' });
  head.appendChild(el('div', { class: 'ico', html: ic(iconName, 18) }));
  const txt = el('div');
  txt.appendChild(el('h3', { html: title }));
  if (desc) txt.appendChild(el('p', { html: desc }));
  head.appendChild(txt);
  if (tail) {
    const t = el('div', { class: 'tail' });
    (Array.isArray(tail) ? tail : [tail]).forEach((n) => t.appendChild(n));
    head.appendChild(t);
  }
  card.appendChild(head);
  const body = el('div', { class: `d-card-body${noPad ? ' no-pad' : ''}` });
  (Array.isArray(children) ? children : [children]).filter(Boolean).forEach((c) => body.appendChild(c));
  card.appendChild(body);
  return card;
}

/* محرّر قوائم (قنوات/رتب): شرائح + إضافة من قائمة منسدلة */
function dListEditor(path, { type = 'channel', placeholder = 'اختر...' } = {}) {
  const wrap = el('div');
  const current = getPath(path) || [];
  const chips = el('div', { class: 'd-chips', style: 'margin-bottom:8px' });

  if (!current.length) chips.appendChild(el('span', { class: 'd-field-label', html: '<span>لا يوجد شيء مضاف بعد.</span>' }));

  current.forEach((id, index) => {
    const found = state.meta.channels.find((c) => c.id === id);
    const label = type === 'channel' ? (found ? (found.type === 4 ? `[قسم] ${found.name}` : `#${found.name}`) : id) : type === 'role' ? nameOfRole(id) : id;
    const chip = el('span', { class: 'd-chip', text: label });
    const remove = el('button', { html: ic('close', 13), title: 'إزالة' });
    remove.addEventListener('click', () => {
      const list = [...(getPath(path) || [])];
      list.splice(index, 1);
      setPath(path, list);
      renderSection(state.section);
    });
    chip.appendChild(remove);
    chips.appendChild(chip);
  });

  const select = el('select', { class: 'd-select' });
  select.appendChild(el('option', { value: '', text: placeholder }));
  const options = type === 'channel' ? channelOptions() : roleOptions();
  options.forEach((o) => select.appendChild(el('option', { value: o.value, text: o.label })));

  const add = el('button', { class: 'd-btn sm', html: `${ic('plus', 15)} إضافة` });
  add.addEventListener('click', () => {
    if (!select.value) return toast('اختر عنصرًا أولًا.', true);
    const list = getPath(path) || [];
    if (list.includes(select.value)) return toast('موجود مسبقًا.', true);
    setPath(path, [...list, select.value]);
    renderSection(state.section);
  });

  wrap.appendChild(chips);
  const controls = el('div', { class: 'd-field-control' });
  controls.appendChild(select);
  controls.appendChild(add);
  wrap.appendChild(controls);
  return wrap;
}

      const list = [...(getPath(path) || [])];
      list.splice(index, 1);
      setPath(path, list);
      renderSection(state.section);
    });
    chip.appendChild(remove);
    chips.appendChild(chip);
  });

  const input = el('input', { class: 'd-input', placeholder });
  const add = el('button', { class: 'd-btn sm', html: `${ic('plus', 15)} إضافة` });
  const submit = () => {
    const value = input.value.trim();
    if (!value) return;
    const list = getPath(path) || [];
    if (list.includes(value)) return toast('موجود مسبقًا', true);
    setPath(path, [...list, value]);
    renderSection(state.section);
  };
  add.addEventListener('click', submit);
  input.addEventListener('keydown', (e) => { if (e.key === 'Enter') { e.preventDefault(); submit(); } });

  wrap.appendChild(chips);
  const controls = el('div', { class: 'd-field-control' });
  controls.appendChild(input);
  controls.appendChild(add);
  wrap.appendChild(controls);
  return wrap;
}

/* الوضع الحالي (ليلي/نهاري) */
function currentTheme() {
  return document.documentElement.dataset.theme === 'light' ? 'light' : 'dark';
}

/* ============================ أدوات داخل الأقسام ============================ */
function testButton(label, action = 'test') {
  const btn = el('button', { class: 'd-btn sm ghost', html: label });
  btn.addEventListener('click', async () => {
    btn.disabled = true;
    try {
      const body = { type: state.section, channelId: state.panelChannelId || null };
      const result = await api(`/guilds/${state.guildId}/actions/${action}`, { method: 'POST', body });
      toast(result.message || 'تم الإرسال — راجعه في ديسكورد.');
    } catch (err) {
      toast(err.message, true);
    } finally {
      btn.disabled = false;
    }
  });
  return btn;
}

function setAllLogs(value) {
  const keys = Object.keys(state.meta.logEvents || {});
  keys.forEach((k) => setPath(`logs.events.${k}`, value));
  renderSection('logs');
}

function setGroupLogs(keys, value) {
  keys.forEach((k) => setPath(`logs.events.${k}`, value));
  renderSection('logs');
}

function buildChart() {
  const wrap = el('div', { style: 'padding:6px 2px' });
  const daily = state.daily || [];
  if (!daily.length) return el('div', { class: 'd-empty', html: `<span class="big">${ic('activity', 28)}</span>لا توجد بيانات نشاط بعد.` });
  const max = Math.max(1, ...daily.map((d) => Math.max(d.messages || 0, d.joins || 0)));
  const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
  svg.setAttribute('viewBox', `0 0 ${daily.length * 34} 120`);
  svg.setAttribute('style', 'width:100%;height:150px');
  daily.forEach((d, i) => {
    const h = Math.round(((d.messages || 0) / max) * 100);
    const rect = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
    rect.setAttribute('x', String(i * 34 + 6));
    rect.setAttribute('y', String(110 - h));
    rect.setAttribute('width', '18');
    rect.setAttribute('height', String(h));
    rect.setAttribute('rx', '5');
    rect.setAttribute('fill', '#5865f2');
    rect.appendChild(document.createElementNS('http://www.w3.org/2000/svg', 'title')).textContent = `${d.day}: ${d.messages || 0} رسالة • ${d.joins || 0} انضمام`;
    svg.appendChild(rect);
  });
  wrap.appendChild(svg);
  wrap.appendChild(el('div', { class: 'muted', style: 'font-size:.8rem;margin-top:4px', text: 'الأعمدة = عدد الرسائل اليومية' }));
  return wrap;
}

/* تحويل آيديات إلى أسماء أعضاء */
async function resolveMembers(ids) {
  const unique = [...new Set((ids || []).filter((id) => id && /^\d{15,25}$/.test(String(id))))].slice(0, 80);
  if (!unique.length) return new Map();
  try {
    const data = await api(`/guilds/${state.guildId}/members?ids=${unique.join(',')}`);
    return new Map(data.members.map((m) => [m.id, m]));
  } catch {
    return new Map();
  }
}

function memberCell(map, id) {
  const member = map.get(String(id));
  const cell = el('div', { class: 'd-member' });
  if (member?.avatar) cell.appendChild(el('img', { src: member.avatar, alt: '' }));
  const txt = el('div');
  txt.appendChild(el('div', { class: 'nm', text: member?.displayName || member?.username || String(id) }));
  txt.appendChild(el('div', { class: 'tg', text: member?.username ? `@${member.username}` : String(id) }));
  cell.appendChild(txt);
  return cell;
}

async function loadDataView(box, view) {
  box.innerHTML = '<div class="d-empty">جارٍ التحميل…</div>';
  try {
    if (view === 'cases') {
      const data = await api(`/guilds/${state.guildId}/cases?perPage=25`);
      if (!data.items.length) return (box.innerHTML = '<div class="d-empty"><span class="big">لا توجد حالات مسجّلة بعد.</span></div>');
      const members = await resolveMembers(data.items.flatMap((c) => [c.user_id, c.moderator_id]));
      const TYPES = { warn: 'تحذير', ban: 'حظر', unban: 'فك حظر', kick: 'طرد', timeout: 'إسكات', untimeout: 'فك إسكات', ticket: 'تذكرة', automod: 'حماية تلقائية' };
      const table = el('table', { class: 'd-table' });
      table.appendChild(
        el('thead', {}, '<tr><th>#</th><th>النوع</th><th>العضو</th><th>السبب</th><th>بواسطة</th><th>التاريخ</th></tr>'),
      );
      const body = el('tbody');
      data.items.forEach((c) => {
        const tr = el('tr');
        tr.appendChild(el('td', { html: `<code>#${c.id}</code>` }));
        tr.appendChild(el('td', { text: TYPES[c.type] || c.type }));
        const u = el('td'); u.appendChild(memberCell(members, c.user_id)); tr.appendChild(u);
        tr.appendChild(el('td', { text: c.reason || '—' }));
        const m = el('td'); m.appendChild(memberCell(members, c.moderator_id)); tr.appendChild(m);
        tr.appendChild(el('td', { text: new Date(c.created_at).toLocaleString('ar-EG') }));
        body.appendChild(tr);
      });
      table.appendChild(body);
      box.innerHTML = '';
      const card1 = el('div', { class: 'd-card' });
      const wrap1 = el('div', { class: 'd-table-wrap' });
      wrap1.appendChild(table);
      card1.appendChild(wrap1);
      box.appendChild(card1);
      box.appendChild(el('div', { class: 'muted', style: 'margin-top:8px;font-size:.82rem', text: `الإجمالي: ${data.total} حالة — تُعرض ${data.items.length}` }));
      return;
    }

    if (view === 'tickets') {
      const data = await api(`/guilds/${state.guildId}/tickets?limit=50`);
      if (!data.items.length) return (box.innerHTML = '<div class="d-empty">لا توجد تذاكر بعد.</div>');
      const typeLabels = new Map((state.settings.tickets.types || []).map((t) => [t.id, t.label]));
      const members = await resolveMembers(data.items.map((t) => t.user_id));
      const table = el('table', { class: 'd-table' });
      table.appendChild(el('thead', {}, '<tr><th>#</th><th>النوع</th><th>صاحب التذكرة</th><th>الحالة</th><th>التاريخ</th><th></th></tr>'));
      const body = el('tbody');
      data.items.forEach((t) => {
        const tr = el('tr');
        tr.appendChild(el('td', { html: `<code>#${t.id}</code>` }));
        tr.appendChild(el('td', { text: typeLabels.get(t.type) || t.type }));
        const u = el('td'); u.appendChild(memberCell(members, t.user_id)); tr.appendChild(u);
        tr.appendChild(el('td', { html: t.status === 'open' ? '<span class="state-on">مفتوحة</span>' : '<span class="state-off">مغلقة</span>' }));
        tr.appendChild(el('td', { text: new Date(t.created_at).toLocaleString('ar-EG') }));
        const acts = el('td');
        if (t.status === 'open') {
          const btn = el('button', { class: 'd-btn sm danger', html: 'إغلاق' });
          btn.addEventListener('click', async () => {
            try {
              await api(`/guilds/${state.guildId}/tickets/${t.id}/close`, { method: 'POST', body: {} });
              toast(`أُغلقت التذكرة #${t.id}.`);
              loadDataView(box, 'tickets');
            } catch (err) {
              toast(err.message, true);
            }
          });
          acts.appendChild(btn);
        }
        tr.appendChild(acts);
        body.appendChild(tr);
      });
      table.appendChild(body);
      box.innerHTML = '';
      const card = el('div', { class: 'd-card' });
      const wrap = el('div', { class: 'd-table-wrap' });
      wrap.appendChild(table);
      card.appendChild(wrap);
      box.appendChild(card);
      return;
    }

    const data = await api(`/guilds/${state.guildId}/levels?perPage=25`);
    if (!data.items.length) return (box.innerHTML = '<div class="d-empty">لا يوجد أعضاء بمستويات بعد.</div>');
    const members = await resolveMembers(data.items.map((l) => l.user_id));
    const table = el('table', { class: 'd-table' });
    table.appendChild(el('thead', {}, '<tr><th>الترتيب</th><th>العضو</th><th>المستوى</th><th>الخبرة</th><th>الرسائل</th></tr>'));
    const body = el('tbody');
    data.items.forEach((l, i) => {
      const tr = el('tr');
      tr.appendChild(el('td', { html: i < 3 ? `<b class="rank rank-${i + 1}">${i + 1}</b>` : `<code>${i + 1}</code>` }));
      const u = el('td'); u.appendChild(memberCell(members, l.user_id)); tr.appendChild(u);
      tr.appendChild(el('td', { html: `<b>${l.level}</b>` }));
      tr.appendChild(el('td', { text: Number(l.xp).toLocaleString('ar-EG') }));
      tr.appendChild(el('td', { text: Number(l.messages || 0).toLocaleString('ar-EG') }));
      body.appendChild(tr);
    });
    table.appendChild(body);
    box.innerHTML = '';
    const card = el('div', { class: 'd-card' });
    const wrap = el('div', { class: 'd-table-wrap' });
    wrap.appendChild(table);
    card.appendChild(wrap);
    box.appendChild(card);
  } catch (err) {
    box.innerHTML = `<div class="d-empty">تعذّر التحميل: ${esc(err.message)}</div>`;
  }
}

/* ============================ الهيكل العام ============================ */
const GROUP_ORDER = ['عام', 'الأعضاء', 'الحماية', 'التذاكر', 'السجلات', 'البيانات'];

function buildSidebar() {
  const side = el('aside', { class: 'd-side' });

  const brand = el('div', { class: 'd-side-brand' });
  brand.appendChild(el('span', { class: 'logo', html: logoMark(30) }));
  brand.appendChild(el('span', { html: 'Never<span class="accent">Land</span>' }));
  brand.appendChild(el('a', { class: 'back', href: '/dashboard', html: `${ic('chevronRight', 13)} السيرفرات` }));
  side.appendChild(brand);

  const search = el('div', { class: 'd-search' });
  search.appendChild(el('span', { class: 'ico', html: ic('search', 16) }));
  const searchInput = el('input', { type: 'text', placeholder: 'ابحث عن إعداد...' });
  search.appendChild(searchInput);
  side.appendChild(search);

  const nav = el('nav');
  const items = [];

  GROUP_ORDER.forEach((group) => {
    const entries = Object.entries(SECTIONS).filter(([, s]) => s.group === group);
    if (!entries.length) return;
    const groupWrap = el('div', { class: 'd-group' });
    groupWrap.appendChild(el('div', { class: 'd-group-title', text: group }));
    entries.forEach(([id, section]) => {
      const item = el('div', { class: 'd-nav-item', 'data-id': id });
      item.appendChild(el('span', { class: 'ico', html: ic(SECTION_ICONS[id] || 'circle', 18) }));
      item.appendChild(el('span', { text: section.label }));
      const dot = el('span', { class: 'dot' });
      item.appendChild(dot);
      item.addEventListener('click', () => {
        state.section = id;
        renderSection(id);
        if (window.innerWidth <= 900) item.scrollIntoView({ behavior: 'smooth', inline: 'center' });
      });
      groupWrap.appendChild(item);
      items.push({ item, id, label: section.label, group, dot });
    });
    nav.appendChild(groupWrap);
  });

  side.appendChild(nav);

  searchInput.addEventListener('input', () => {
    const q = searchInput.value.trim().toLowerCase();
    items.forEach(({ item, label, group }) => {
      const match = !q || label.toLowerCase().includes(q) || group.toLowerCase().includes(q);
      item.style.display = match ? '' : 'none';
    });
    nav.querySelectorAll('.d-group').forEach((g) => {
      const visible = [...g.querySelectorAll('.d-nav-item')].some((i) => i.style.display !== 'none');
      g.style.display = visible ? '' : 'none';
    });
  });

  side.appendChild(
    el('div', {
      class: 'd-side-foot',
      html: `كل الإعدادات متاحة هنا، ولكل إعداد أمر سلاش مكافئ في ديسكورد.`,
    }),
  );

  return { side, items };
}

function buildHeader() {
  const head = el('div', { class: 'd-head' });
  head.appendChild(
    state.guild.icon
      ? el('img', { class: 'guild-icon', src: `https://cdn.discordapp.com/icons/${state.guild.id}/${state.guild.icon}.png?size=128`, alt: '' })
      : el('div', { class: 'guild-icon', html: esc((state.guild.name || '?').slice(0, 2)) }),
  );
  const info = el('div');
  info.appendChild(el('h1', { text: state.guild.name }));
  info.appendChild(
    el('div', {
      class: 'sub',
      html: `${(state.guild.memberCount || 0).toLocaleString('ar-EG')} عضو · <span class="${state.guild.botOnline ? 'state-on' : 'state-off'}">${state.guild.botOnline ? 'البوت متصل' : 'البوت غير متصل'}</span> · آخر تحديث ${new Date().toLocaleTimeString('ar-EG')}`,
    }),
  );
  head.appendChild(info);

  const actions = el('div', { class: 'd-head-actions' });
  const themeBtn = el('button', { class: 'd-btn ghost sm' });
  const themeMode = () => {
    try {
      const saved = localStorage.getItem('neverland-theme');
      return saved === 'light' || saved === 'dark' ? saved : 'auto';
    } catch { return 'auto'; }
  };
  const paintTheme = () => {
    const mode = themeMode();
    const shown = mode === 'auto' ? currentTheme() : mode;
    const label = mode === 'auto' ? 'حسب الجهاز' : shown === 'light' ? 'الوضع النهاري' : 'الوضع الليلي';
    themeBtn.innerHTML = `${ic(mode === 'auto' ? 'refresh' : shown === 'light' ? 'sun' : 'moon', 16)} ${label}`;
    themeBtn.title = 'السمة: ' + label + ' — اضغط للتبديل';
  };
  paintTheme();
  themeBtn.addEventListener('click', () => {
    const order = { auto: 'light', light: 'dark', dark: 'auto' };
    const next = order[themeMode()];
    try {
      if (next === 'auto') localStorage.removeItem('neverland-theme');
      else localStorage.setItem('neverland-theme', next);
    } catch { /* تجاهل */ }
    document.documentElement.dataset.theme = next === 'auto' ? (window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark') : next;
    paintTheme();
  });
  actions.appendChild(themeBtn);

  const refresh = el('button', { class: 'd-btn ghost sm', html: `${ic('refresh', 16)} تحديث` });
  refresh.addEventListener('click', () => boot());
  actions.appendChild(refresh);
  head.appendChild(actions);
  return head;
}

function renderSection(id) {
  const section = SECTIONS[id];
  if (!section) return;

  document.querySelectorAll('.d-nav-item').forEach((i) => i.classList.toggle('active', i.dataset.id === id));
  const content = document.getElementById('d-content');
  content.innerHTML = '';
  content.appendChild(el('h2', { class: 'd-page-title', html: `${section.icon} ${section.title}` }));
  content.appendChild(el('p', { class: 'd-page-desc', html: section.desc }));

  // كل قسم يقدر يرجّع عنصرًا واحدًا أو مصفوفة عناصر أو Fragment
  const output = section.render();
  (Array.isArray(output) ? output : [output]).filter(Boolean).forEach((node) => content.appendChild(node));
  if (typeof window.scrollTo === 'function') window.scrollTo({ top: 0, behavior: 'smooth' });
}

function updateDots(items) {
  const map = {
    overview: null,
    general: null,
    welcome: 'welcome.enabled',
    autorole: 'autorole.enabled',
    leveling: 'leveling.enabled',
    automod: 'automod.enabled',
    moderation: null,
    autoline: 'autoline.enabled',
    autoreact: 'autoreact.enabled',
    tickets: 'tickets.enabled',
    staffapp: 'staffApplication.enabled',
    logs: 'logs.enabled',
    data: null,
  };
  items.forEach(({ item, id }) => {
    const dot = item.querySelector('.dot');
    const key = map[id];
    dot.classList.toggle('off', key ? !getPath(key) : true);
    if (!key) dot.style.display = 'none';
    else dot.style.display = '';
  });
}

/* ============================ الإقلاع ============================ */
async function boot() {
  const root = document.getElementById('app');
  state.guildId = root.dataset.guild;
  root.innerHTML = '<div class="d-loading"><div class="d-spinner"></div><div>جارٍ تحميل إعدادات السيرفر…</div></div>';

  try {
    const data = await api(`/guilds/${state.guildId}`);
    state.canEdit = data.viewer ? Boolean(data.viewer.canEdit) : root.dataset.edit !== '0';
    state.settings = data.settings;
    state.guild = data.guild;
    state.stats = data.stats;
    state.daily = data.daily || [];
    state.meta = data.meta;
    state.dirty = false;

    root.innerHTML = '';
    const shell = el('div', { class: `d-shell${state.canEdit ? '' : ' readonly'}` });
    if (!state.canEdit) {
      shell.appendChild(
        el('div', {
          class: 'd-readonly-note',
          html: `${ic('shield', 17)} <b>عرض عام</b> — تقدر تتصفّح الإعدادات بحرية، أما التعديل فيحتاج تسجيل دخول بحساب Discord.
            <a class="d-btn primary sm" href="/auth/login">${ic('login', 15)} تسجيل الدخول</a>`,
        }),
      );
    }
    const { side, items } = buildSidebar();
    window.__dashItems = items;
    shell.appendChild(side);

    const main = el('div', { class: 'd-main' });
    main.appendChild(buildHeader());
    const content = el('div', { class: 'd-content', id: 'd-content' });
    main.appendChild(content);
    shell.appendChild(main);
    root.appendChild(shell);

    /* شريط الحفظ (للمسجّلين فقط) */
    if (state.canEdit) {
    const bar = el('div', { class: 'd-savebar' });
    const msg = el('span', { class: 'msg', text: 'تغييرات غير محفوظة' });
    const grow = el('span', { class: 'grow' });
    const reset = el('button', { class: 'd-btn ghost', html: `${ic('undo', 16)} تراجع` });
    reset.addEventListener('click', () => boot());
    const save = el('button', { class: 'd-btn primary', html: `${ic('save', 16)} حفظ التغييرات` });
    save.addEventListener('click', async () => {
      save.disabled = true;
      try {
        await api(`/guilds/${state.guildId}/settings`, { method: 'POST', body: state.settings });
        state.dirty = false;
        bar.classList.remove('show');
        toast('تم حفظ الإعدادات.');
      } catch (err) {
        msg.className = 'msg';
        msg.textContent = err.message;
        toast(err.message, true);
      } finally {
        save.disabled = false;
      }
    });
    [msg, grow, reset, save].forEach((n) => bar.appendChild(n));
    main.appendChild(bar);
    }

    items.forEach(({ item }) => item.classList.toggle('active', item.dataset.id === state.section));
    renderSection(state.section);
    updateDots(items);
  } catch (err) {
    root.innerHTML = `<div class="d-loading"><div class="d-empty-ico">${ic('warning', 34)}</div><div>تعذّر تحميل الإعدادات: ${esc(err.message)}</div><a class="d-btn primary" href="/dashboard">الرجوع إلى السيرفرات</a></div>`;
  }
}

document.addEventListener('DOMContentLoaded', boot);

</script>
